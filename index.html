<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MedAtlas AI - Femur Atlas</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>
    <h1>🦴 MedAtlas AI</h1>
    <p>Interactive 3D Anatomy Learning Platform</p>
</header>


<main class="container">

<section class="viewer">

<div class="model-container">

<iframe
src="https://sketchfab.com/models/a9c1f1a88b104c3fbfe975fa10b31b31/embed"
allowfullscreen>
</iframe>


<button class="hotspot head"
onclick="showPart('head')">
</button>


<button class="hotspot neck"
onclick="showPart('neck')">
</button>


<button class="hotspot greater"
onclick="showPart('greater')">
</button>


</div>

</section>




<section class="info">

<h2>Femur Structures</h2>


<ul class="parts">

<li onclick="showPart('head')">Head</li>

<li onclick="showPart('neck')">Neck</li>

<li onclick="showPart('greater')">
Greater Trochanter
</li>

<li onclick="showPart('lesser')">
Lesser Trochanter
</li>

<li onclick="showPart('shaft')">
Shaft
</li>

<li onclick="showPart('medial')">
Medial Condyle
</li>

<li onclick="showPart('lateral')">
Lateral Condyle
</li>

</ul>



<div class="description">

<h3 id="partTitle">
Head of Femur
</h3>


<p id="partText">
The head articulates with the acetabulum forming the hip joint.
</p>

</div>


</section>


</main>


<script src="script.js"></script>

</body>
</html>
